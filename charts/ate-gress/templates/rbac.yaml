apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ate-gress.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ate-gress.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ate-gress.name" . }}
  labels:
    {{- include "ate-gress.labels" . | nindent 4 }}
rules:
{{ .Files.Get "files/clusterrole-rules.yaml" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ate-gress.name" . }}
  labels:
    {{- include "ate-gress.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ate-gress.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "ate-gress.name" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader election for the status writer, in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ate-gress.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ate-gress.labels" . | nindent 4 }}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ate-gress.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ate-gress.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ate-gress.name" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "ate-gress.name" . }}
  namespace: {{ .Release.Namespace }}
