{{- if .Values.networkPolicy.enabled }}
# Only Substrate's egress gateway may reach ext_proc. The mTLS check on the
# gateway's SPIFFE ID enforces this regardless; the policy keeps everything
# else from even completing a handshake.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ate-gress.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ate-gress.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ate-gress.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.gateway.namespace }}
      podSelector:
        matchLabels:
          {{- toYaml .Values.gateway.podLabels | nindent 10 }}
    ports:
    - port: grpc
  - ports:
    - port: metrics
    {{- with .Values.networkPolicy.metricsFrom }}
    from:
      {{- toYaml . | nindent 4 }}
    {{- end }}
  # The kubelet's probes are not subject to NetworkPolicy on most CNIs, but
  # some enforce it; allow them explicitly.
  - ports:
    - port: probes
{{- end }}
