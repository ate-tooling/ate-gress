{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ate-gress.name" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ate-gress.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ate-gress.json: |-
    {{- .Files.Get "files/dashboards/ate-gress.json" | trim | nindent 4 }}
{{- end }}
