# A stand-in for one request leg of Substrate's egress gateway
# (manifests/ate-install/atenet-egress.yaml), with ate-gress spliced in the way
# the installer and the agent-substrate-operator splice it.
#
# Two blocks are copied verbatim from what the operator renders for
# additionalEgressExtprocService: ate-gress/ate-gress:9443
# (agent-substrate-operator internal/render/egress.go, extprocFilter and
# extprocCluster; upstream cmd/ate-setup/internal/steps/overlay.go). Keep them
# in step with it: they are what this test exists to pin. Only the cluster's
# endpoint address differs, because ate-gress runs on the Docker host.
#
# What stands in for the rest of the gateway:
#   - The outer CONNECT leg sets dev.ate.actor.identity from the actor's
#     certificate. Here set_filter_state takes it from the x-test-actor header.
#   - Substrate's own egress policy filter is absent: ate-gress sits after it
#     and sees only what it allowed.
#   - The upstream is a direct response, so a 200 with body "upstream" means
#     the request got past every filter.
# File-based SDS needs a node identity, as the gateway's bootstrap gives it.
node:
  id: ate-gress-envoy-test
  cluster: atenet-egress
static_resources:
  listeners:
  - name: egress_request_leg
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mitm_http
          # Substrate's request legs set no path normalization; neither does
          # this, so ate-gress sees :path exactly as the client sent it.
          route_config:
            virtual_hosts:
            - name: any
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                direct_response:
                  status: 200
                  body: { inline_string: "upstream" }
          http_filters:
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              on_request_headers:
              - object_key: dev.ate.actor.identity
                factory_key: envoy.hashable_string
                shared_with_upstream: TRANSITIVE
                skip_if_empty: true
                format_string:
                  text_format_source:
                    inline_string: "%REQ(x-test-actor)%"
                  omit_empty_values: true
          # --- verbatim: extprocFilter ---
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: additional_egress_ext_proc
                timeout: 2s
              failure_mode_allow: false
              message_timeout: 2s
              request_attributes:
              - filter_state['dev.ate.actor.identity']
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SKIP
                request_body_mode: NONE
                response_body_mode: NONE
                request_trailer_mode: SKIP
                response_trailer_mode: SKIP
              mutation_rules:
                disallow_system: true
                disallow_is_error: true
          # --- end verbatim ---
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  # --- verbatim: extprocCluster ---
  - name: additional_egress_ext_proc
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    connect_timeout: 1s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: ate-gress.ate-gress.svc
        common_tls_context:
          tls_params:
            tls_minimum_protocol_version: TLSv1_3
            tls_maximum_protocol_version: TLSv1_3
          tls_certificate_sds_secret_configs:
          - name: podidentity_client_cert
            sds_config:
              resource_api_version: V3
              path_config_source:
                path: /etc/envoy/sds-podidentity-cert.yaml
          combined_validation_context:
            default_validation_context:
              match_typed_subject_alt_names:
              - san_type: DNS
                matcher:
                  exact: ate-gress.ate-gress.svc
            validation_context_sds_secret_config:
              name: servicedns_validation_context
              sds_config:
                resource_api_version: V3
                path_config_source:
                  path: /etc/envoy/sds-servicedns-validation.yaml
    load_assignment:
      cluster_name: additional_egress_ext_proc
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ategress-host
                port_value: @EXTPROC_PORT@
  # --- end verbatim ---
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
