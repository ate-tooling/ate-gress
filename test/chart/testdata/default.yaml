---
# Source: ate-gress/templates/networkpolicy.yaml
# Only Substrate's egress gateway may reach ext_proc. The mTLS check on the
# gateway's SPIFFE ID enforces this regardless; the policy keeps everything
# else from even completing a handshake.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-gress
  namespace: ate-gress
  labels:
    app.kubernetes.io/name: ate-gress
    app.kubernetes.io/instance: ate-gress
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ate-gress-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ate-gress
      app.kubernetes.io/instance: ate-gress
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ate-system
      podSelector:
        matchLabels:
          app: atenet-egress
    ports:
    - port: grpc
  - ports:
    - port: metrics
  # The kubelet's probes are not subject to NetworkPolicy on most CNIs, but
  # some enforce it; allow them explicitly.
  - ports:
    - port: probes

