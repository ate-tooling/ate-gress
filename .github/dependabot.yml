version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  # Kubernetes and controller-runtime move together, so minor and major
  # releases are bumped by hand. Dependabot proposes their patch releases.
  ignore:
  - dependency-name: "k8s.io/*"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - dependency-name: "sigs.k8s.io/controller-runtime"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
  groups:
    kubernetes:
      patterns:
      - "k8s.io/*"
      - "sigs.k8s.io/*"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  # A new action version waits a week before it is proposed, so a compromised
  # release has time to be noticed and pulled.
  cooldown:
    default-days: 7
  groups:
    actions:
      patterns: ["*"]
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
