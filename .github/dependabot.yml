version: 2
updates:
# Every update waits a week after its release before it is proposed, so a
# compromised release has time to be noticed and pulled.
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  # Kubernetes and controller-runtime move together, so minor and major
  # releases are bumped by hand. Dependabot proposes their patch releases.
  ignore:
  - dependency-name: "k8s.io/*"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - dependency-name: "sigs.k8s.io/controller-runtime"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
  groups:
    kubernetes:
      patterns:
      - "k8s.io/*"
      - "sigs.k8s.io/*"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    actions:
      patterns: ["*"]
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
# The newest stable Envoy that the envoy workflow runs test/envoy against.
# The Envoy that Substrate's gateway ships (ENVOY_IMAGE in the Makefile)
# follows Substrate and is moved by hand; see docs/ci.md.
- package-ecosystem: docker
  directory: /test/envoy
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
