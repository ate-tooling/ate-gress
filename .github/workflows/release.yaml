# Publishes a release from a vX.Y.Z tag (vX.Y.Z-rc.N for a prerelease):
#
#   ghcr.io/<owner>/ate-gress:X.Y.Z         multi-arch image
#   oci://ghcr.io/<owner>/charts/ate-gress   Helm chart, pinned to that image's digest
#   GitHub release                           CRD, chart archive, SBOM, checksums
#
# Every artifact is signed with Sigstore keyless signing (cosign) and carries a
# GitHub build-provenance attestation; the image also carries an SPDX SBOM
# attestation. Signatures and attestations are bound to this workflow file and
# the tag, which is what docs/releasing.md tells consumers to verify. The last
# job verifies them the same way before the release is considered done.
#
# Tags are never overwritten: a version whose image already exists fails.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      image: ${{ steps.plan.outputs.image }}
      charts: ${{ steps.plan.outputs.charts }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      epoch: ${{ steps.plan.outputs.epoch }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: plan
      run: |
        version="${GITHUB_REF_NAME#v}"
        if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::${GITHUB_REF_NAME} is not a semantic version tag"
          exit 1
        fi
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/ate-gress"
        if docker buildx imagetools inspect "${image}:${version}" >/dev/null 2>&1; then
          echo "::error::${image}:${version} already exists; tags are never overwritten"
          exit 1
        fi
        prerelease=false
        [[ "${version}" == *-* ]] && prerelease=true
        {
          echo "version=${version}"
          echo "image=${image}"
          echo "charts=ghcr.io/${owner}/charts"
          echo "prerelease=${prerelease}"
          # The commit time, so a rebuild of the same commit produces the same
          # image timestamps.
          echo "epoch=$(git log -1 --format=%ct)"
        } >>"${GITHUB_OUTPUT}"

  image:
    name: Image
    needs: [ci, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push the image
      id-token: write      # Sigstore keyless signing
      attestations: write  # provenance and SBOM attestations
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # X.Y.Z always; X.Y only for a full release (metadata-action skips it for
    # prereleases). No "latest": deployments pin a version.
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ needs.plan.outputs.image }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
        flavor: latest=false
        labels: |
          org.opencontainers.image.title=ate-gress
          org.opencontainers.image.description=L7 egress route policy for Agent Substrate
          org.opencontainers.image.licenses=Apache-2.0
    # BuildKit's own provenance and SBOM are off: they would add
    # "unknown/unknown" manifests to the index, and the attestations below
    # cover the same ground in a form `gh attestation verify` checks.
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: VERSION=${{ needs.plan.outputs.version }}
        provenance: false
        sbom: false
      env:
        SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.epoch }}
        # The build record is a run artifact nothing here uses.
        DOCKER_BUILD_RECORD_UPLOAD: false
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - run: cosign sign --yes "${IMAGE}@${DIGEST}"
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ needs.plan.outputs.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
    - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ needs.plan.outputs.image }}@${{ steps.build.outputs.digest }}
        # Pinned, because the SBOM attestation's predicate type names the SPDX
        # version and verifiers ask for it by name.
        format: spdx-json@2.3
        output-file: ate-gress-${{ needs.plan.outputs.version }}.spdx.json
        upload-artifact: false
        upload-release-assets: false
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ needs.plan.outputs.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        sbom-path: ate-gress-${{ needs.plan.outputs.version }}.spdx.json
        push-to-registry: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom
        path: ate-gress-${{ needs.plan.outputs.version }}.spdx.json
        if-no-files-found: error

  chart:
    name: Helm chart
    needs: [plan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write      # push the chart
      id-token: write      # Sigstore keyless signing
      attestations: write  # provenance attestation
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      CHARTS: ${{ needs.plan.outputs.charts }}
      VERSION: ${{ needs.plan.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    # The released chart installs exactly the image built above, by digest.
    - id: package
      run: |
        hack/package-chart.sh "${VERSION}" "${DIGEST}" dist
        echo "archive=dist/ate-gress-${VERSION}.tgz" >>"${GITHUB_OUTPUT}"
    - id: push
      run: |
        helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"
        helm push "${ARCHIVE}" "oci://${CHARTS}" 2>&1 | tee push.log
        digest="$(sed -n 's/^Digest: //p' push.log)"
        [[ -n "${digest}" ]] || { echo "::error::helm push printed no digest"; exit 1; }
        echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
      env:
        ARCHIVE: ${{ steps.package.outputs.archive }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GITHUB_TOKEN}"
        cosign sign --yes "${CHARTS}/ate-gress@${CHART_DIGEST}"
      env:
        CHART_DIGEST: ${{ steps.push.outputs.digest }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ needs.plan.outputs.charts }}/ate-gress
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chart
        path: ${{ steps.package.outputs.archive }}
        if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [plan, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
      id-token: write      # Sigstore keyless signing
      attestations: write  # provenance for the release files
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ${{ needs.plan.outputs.image }}
      CHARTS: ${{ needs.plan.outputs.charts }}
      DIGEST: ${{ needs.image.outputs.digest }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # By name: everything in dist/ is published and attested, so it must hold
    # exactly the release files and nothing else the run uploaded.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: sbom
        path: dist
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: chart
        path: dist
    - run: |
        cp config/crd/ategress.ate-tooling.github.io_egressroutepolicies.yaml \
          "dist/ate-gress-${VERSION}-crds.yaml"
        want="$(printf '%s\n' "ate-gress-${VERSION}-crds.yaml" "ate-gress-${VERSION}.spdx.json" \
          "ate-gress-${VERSION}.tgz" | LC_ALL=C sort | xargs)"
        got="$(find dist -mindepth 1 -maxdepth 1 -printf '%P\n' | LC_ALL=C sort | xargs)"
        if [[ "${got}" != "${want}" ]]; then
          echo "::error::dist/ holds '${got}', want '${want}'"
          exit 1
        fi
        (cd dist && sha256sum -- * >checksums.txt)
        cat dist/checksums.txt
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: dist/checksums.txt
    - run: |
        notes="$(mktemp)"
        cat >"${notes}" <<NOTES
        ## Install

        \`\`\`sh
        helm install ate-gress oci://${CHARTS}/ate-gress --version ${VERSION} \\
          --namespace ate-gress --create-namespace
        \`\`\`

        Image: \`${IMAGE}:${VERSION}@${DIGEST}\`

        Verify the image, chart and files before installing:
        [docs/releasing.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/releasing.md#verifying-a-release).

        NOTES
        flags=(--verify-tag --generate-notes --notes-file "${notes}" --title "${GITHUB_REF_NAME}")
        [[ "${PRERELEASE}" == true ]] && flags+=(--prerelease)
        gh release create "${GITHUB_REF_NAME}" "${flags[@]}" dist/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Checks what was published the way a consumer would, against the identity
  # in docs/releasing.md. If this fails, the release is not trustworthy as
  # documented; fix it before announcing.
  verify:
    name: Verify release
    needs: [plan, image, chart, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read  # the packages may still be private
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ${{ needs.plan.outputs.image }}
      CHARTS: ${{ needs.plan.outputs.charts }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
    - run: hack/verify-release.sh "${VERSION}" "${IMAGE}" "${CHARTS}" "${GITHUB_REPOSITORY}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        CHART_DIGEST: ${{ needs.chart.outputs.digest }}
