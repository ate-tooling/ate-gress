# Pull requests and main run the checks, the real-Envoy integration test, a
# chart upgrade and rollback, and an image build; main and releases also run
# the fuzzers for a short while. The release workflow calls this one first, so
# a tag is published only from a commit that passes it. docs/ci.md lists the other workflows: more Envoy
# versions, longer fuzzing with a saved corpus, and the nightly end-to-end
# test against a real Substrate.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
    # Regenerates code, CRD, and RBAC and fails if they are stale, then lints
    # and runs the unit and envtest suites.
    - run: make verify
    - run: make validate-chart
    - run: make vulncheck

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Template injection, excessive permissions, unpinned actions, credential
    # persistence.
    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        advanced-security: false
        version: 1.18.0
        persona: pedantic

  # A short run of every target, for main and for a release. Pull requests
  # are fuzzed by the fuzz workflow instead, which has the saved corpus.
  fuzz:
    name: Fuzz
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - run: make fuzz FUZZTIME=60s
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-corpus
        path: internal/**/testdata/fuzz

  envoy:
    name: Envoy integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - run: make test-envoy

  # The same build the release runs, without pushing. The amd64 image is
  # loaded and started, so a broken entrypoint or base image fails here.
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build record is a run artifact nothing here uses.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: ate-gress:ci
    - run: docker run --rm ate-gress:ci --help

  # Installs a published chart on a kind cluster and upgrades it to this
  # commit's, to prove that `helm upgrade` upgrades the CRD, then rolls back,
  # to prove that the earlier CRD can be put back with every policy kept.
  # "latest" is the upgrade the next release's users make, and the rollback
  # they would make. 0.1.0-rc.3 is pinned because it is
  # the last chart whose CRD lacks logAllowed and trailing-slash templates, so
  # that upgrade has to change the schema, and because it shipped the CRD in
  # crds/, so it also covers the adoption step in the README.
  upgrade:
    name: Chart upgrade (from ${{ matrix.from }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        from: [latest, 0.1.0-rc.3]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
    # kind, kubectl and jq come with the runner image.
    - run: hack/upgrade-kind.sh "${FROM}"
      env:
        FROM: ${{ matrix.from }}
